name: "test-p4c-mac"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

# Cancel any preceding run on the pull request.
concurrency:
  group: test-p4c-mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Build and test p4c on latest MacOS
  test-mac-os:
    runs-on: macos-latest
    env:
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies (MacOS)
        run: |
          tools/install_mac_deps.sh
          # The structured diagnostic acceptance suite consumes GCC JSON.
          brew install gcc@14

      # Replaces the manual ccache boilerplate and runs the custom macOS bootstrap pipeline securely
      - name: Setup and baseline build
        uses: ./.github/actions/setup-p4c-build
        with:
          ccache-key: "macos-clang-unity"
          custom-build-command: |
            source ~/.bash_profile
            ./bootstrap.sh -DENABLE_GC=ON -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_UNITY_BUILD=ON -DENABLE_TEST_TOOLS=ON -DENABLE_WERROR=ON --build-generator "Ninja"
            cmake --build build -- -j $(nproc)

      - name: Run tests (MacOS)
        run: |
          source ~/.bash_profile
          gcc_candidates=("$(brew --prefix gcc@14)"/bin/gcc-[0-9]*)
          test "${#gcc_candidates[@]}" -eq 1
          export P4C_TEST_GCC="${gcc_candidates[0]}"
          test -x "$P4C_TEST_GCC"
          "$P4C_TEST_GCC" --version
          uv run ctest --output-on-failure --schedule-random -E "ubpf|testgen|smith"
        working-directory: ./build
