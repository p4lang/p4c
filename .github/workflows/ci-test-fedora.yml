name: "test-p4c-fedora"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fruffy/memory-05-solver]
  merge_group:
    branches: [main]

# Cancel any preceding run on the pull request.
concurrency:
  group: test-p4c-fedora-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Build and test p4c on Fedora.
  test-fedora-linux:
    # This job runs in Fedora container that runs in Ubuntu VM.
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
      options: --privileged
      env:
        IN_DOCKER: "TRUE"
    env:
      CTEST_PARALLEL_LEVEL: 4
    steps:
      # We need to install git here because it is not provided out of the box in Fedora container.
      - name: Install git
        run: dnf install -y -q git

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies (Fedora Linux)
        run: |
          tools/install_fedora_deps.sh
          # TEMPORARY: exercise a newer, unpatched system Z3 with GC enabled.
          dnf install -y z3-devel rapidjson-devel
          # Fedora uses Python 3.14; the older PyInstaller pin cannot read its bytecode.
          uv pip install jsl==0.2.4 pyinstaller==6.16.0 jsonschema==4.23.0 pyyaml==6.0.2
          rpm -q z3-libs z3-devel

      # Custom integration to maintain specific bootstrap/cmake parameters for the Fedora target container environment
      - name: Setup and baseline build
        uses: ./.github/actions/setup-p4c-build
        with:
          ccache-key: "fedora-gcc-unity"
          custom-build-command: |
            set -e
            uv run ./bootstrap.sh -DCMAKE_BUILD_TYPE=Release -DCMAKE_UNITY_BUILD=ON \
                -DUSE_PREINSTALLED_Z3=ON -DENABLE_GC=ON \
                -DENABLE_TEST_TOOLS=ON -DENABLE_TOFINO=ON --build-generator "Ninja"
            grep -E '^(USE_PREINSTALLED_Z3|Z3_INCLUDE_DIR|Z3_LIBRARY):' build/CMakeCache.txt
            test ! -d build/_deps/z3-src
            uv run cmake --build build -- -j $(nproc)

      - name: Run p4c tests (Fedora Linux)
        run: |
          uv run ctest --output-on-failure --schedule-random
        working-directory: ./build
