name: "Setup and Build p4c"
description: "Caches dependency sources and compiler output, then runs the initial CI build."
inputs:
  ccache-key:
    description: "Cache key for jobs using the same compiler and build settings."
    required: true
  max-size:
    description: "Maximum compiler cache size."
    required: false
    default: "750M"
  save-main:
    description: "Allow this job to update the main cache."
    default: "true"
  use-ccache:
    description: "Disable for jobs that do not compile, such as formatting."
    default: "true"
  use-cpm-cache:
    description: "Cache CPM dependency sources; disable for formatting-only jobs."
    default: "true"
  custom-build-command:
    description: "Optional custom compilation commands instead of running ci-build.sh"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Configure dependency source cache
      if: inputs.use-cpm-cache == 'true'
      shell: bash
      run: echo "CPM_SOURCE_CACHE=$RUNNER_TEMP/p4c-cpm" >> "$GITHUB_ENV"
    - name: Restore dependency sources
      if: inputs.use-cpm-cache == 'true'
      id: cpm
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/p4c-cpm
        # Jobs enable different backends; separate keys avoid the first writer
        # permanently caching only a subset of another job's dependencies.
        key: cpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ inputs.ccache-key }}-main-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'backends/**/CMakeLists.txt', 'backends/**/*.cmake', '.github/workflows/*.y*ml') }}
        restore-keys: cpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ inputs.ccache-key }}-main-
    - name: Restore compiler cache
      if: inputs.use-ccache == 'true'
      id: ccache
      uses: ./.github/actions/restore-ccache
      with:
        key: ${{ inputs.ccache-key }}
        max-size: ${{ inputs.max-size }}
    - name: Run baseline CI build
      shell: bash
      env:
        CUSTOM_CMD: ${{ inputs.custom-build-command }}
      run: |
        if [ -n "$CUSTOM_CMD" ]; then
          echo "$CUSTOM_CMD" > custom_build.sh
          chmod +x custom_build.sh
          ./custom_build.sh
          rm custom_build.sh
        else
          tools/ci-build.sh
        fi
    - name: Save compiler cache
      if: inputs.use-ccache == 'true'
      uses: ./.github/actions/save-ccache
      with:
        prefix: ${{ steps.ccache.outputs.prefix }}
        save-main: ${{ inputs.save-main }}
    - name: Save dependency sources
      if: inputs.use-cpm-cache == 'true' && steps.cpm.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'merge_group'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/p4c-cpm
        key: ${{ steps.cpm.outputs.cache-primary-key }}
